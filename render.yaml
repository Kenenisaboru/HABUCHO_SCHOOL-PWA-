services:
  - type: web
    name: habucho-school-api
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    buildCommand: cd server && npm ci
    preDeployCommand: cd server && npm run migrate
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: habucho-school-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: PRIVATE_UPLOAD_DIR
        value: /var/data/private-uploads
      - key: LOG_LEVEL
        value: info

  - type: web
    name: habucho-school-client
    runtime: static
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: VITE_API_URL
        sync: false

databases:
  - name: habucho-school-db
    databaseName: habucho_school
    user: habucho_user
    region: oregon
    plan: 0.1c-256mb
    ipAllowList: []