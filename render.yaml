services:
  - type: web
    name: habucho-school-api
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    buildCommand: cd server && npm ci
    preDeployCommand: cd server && npm run migrate
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: habucho-school-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: PRIVATE_UPLOAD_DIR
        value: /var/data/private-uploads
      - key: LOG_LEVEL
        value: info
      - key: ADMIN_EMAIL
        value: kenenisaboru998@gmail.com
      - key: ADMIN_PASSWORD
        value: kbl@2026
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: kenenisaboru998@gmail.com
      - key: SMTP_PASS
        value: imemewokeomtfhlm
      - key: SMTP_FROM
        value: "Habucho Preparatory School <kenenisaboru998@gmail.com>"
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: dlqmxrx36
      - key: CLOUDINARY_API_KEY
        value: "441939881177415"
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        value: 9090272331:AAH2DnEqKuXS8Bh9nNFbOZTvf06Vq0hxrJw
      - key: TELEGRAM_CHANNEL_ID
        sync: false

  - type: web
    name: habucho-school-client
    runtime: static
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: VITE_API_URL
        sync: false

databases:
  - name: habucho-school-db
    databaseName: habucho_school
    user: habucho_user
    region: oregon
    plan: 0.1c-256mb
    ipAllowList: []