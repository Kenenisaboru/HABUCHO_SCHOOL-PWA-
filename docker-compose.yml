version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: habucho-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-habucho_school}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-habucho_school}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: habucho-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-habucho_school}
      DATABASE_SSL: "${DATABASE_SSL:-false}"
      JWT_SECRET: ${JWT_SECRET:-habucho_super_secret_jwt_key_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-habucho_super_secret_refresh_key_2026}
    command: ["sh", "-c", "npm run migrate && npm start"]
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: habucho-client
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  pgdata:
